title: Double Dragon
subline: Double the filament, double the fun.
description: A V0 mod to add Independent Dual Extrusion (IDEX). X0 for short. X0 adds a second printhead to a V0 to enable multi-color prints, multi-material prints, and even overhangs atop dissolvable supports.
